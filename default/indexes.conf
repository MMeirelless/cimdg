# CIM Data Generator — Synthetic data index
#
# Enterprise only. Splunk Cloud users must create this index manually
# via the Splunk Cloud admin UI or a support request.

[synthetic_cim]
homePath = $SPLUNK_DB/synthetic_cim/db
coldPath = $SPLUNK_DB/synthetic_cim/colddb
thawedPath = $SPLUNK_DB/synthetic_cim/thaweddb
frozenTimePeriodInSecs = 604800
maxTotalDataSizeMB = 5120
